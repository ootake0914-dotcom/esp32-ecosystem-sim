<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CYD Ecosystem Sim Web Installer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            background: #111;
            color: #eee;
            text-align: center;
        }
        img.demo {
            max-width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #fff; }
        p { line-height: 1.5; color: #ccc; }
        esp-web-install-button {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <h1>CYD Ecosystem Sim Web Installer</h1>
    <p>Install the CYD version of the Ecosystem Simulation directly to your ESP32-2432S028R.</p>
    
    <img src="cyd_demo.gif" class="demo" alt="CYD Ecosystem Demo">
    
    <p>Connect your CYD board via USB, click the button below, select the correct COM port, and click "Install".</p>
    
    <script type="module" src="https://unpkg.com/esp-web-tools@9.3.1/dist/web/install-button.js?module"></script>
    <esp-web-install-button manifest="./manifest.json"></esp-web-install-button>

    <p style="font-size: 0.8rem; margin-top: 3rem; color: #666;">
        Requires a Web Serial compatible browser (Chrome, Edge, Opera).
    </p>
</body>
</html>
